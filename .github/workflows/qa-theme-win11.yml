name: Календарь и смена темы в чистой Windows 11
on:
  push:
    branches: [codex/qa-pr104-theme-win11]
    paths: ['.github/workflows/qa-theme-win11.yml']
permissions:
  contents: read
  actions: read
jobs:
  theme:
    runs-on: windows-11-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Проверить Windows и отсутствие RivaTuner
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "$($os.Caption), build $($os.BuildNumber), $env:RUNNER_ARCH"
          if ($os.Caption -notmatch 'Windows 11' -or $env:RUNNER_ARCH -ne 'ARM64') { throw 'Ожидалась клиентская Windows 11 ARM64' }
          if (Get-Process -Name 'RTSS*' -ErrorAction SilentlyContinue) { throw 'Обнаружен активный оверлей' }
      - name: Получить проверенную переносную сборку
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: '44965000691'
          SOURCE_HEAD: 41d3a7649266f8357ac8b95b056a678b52bd99fd
          ZIP_ID: '14731644096'
          SHA256: 3181d4344d5926af51ee1473d38f7b53773b82d60303e02fde350ea8054ef154
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ZIP_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $meta.name -ne 'kazna-windows-portable' -or $meta.workflow_run.id -ne [long]$env:SOURCE_RUN -or $meta.workflow_run.head_sha -ne $env:SOURCE_HEAD -or $meta.digest -ne "sha256:$env:SHA256") { throw 'Не подтверждён артефакт этого коммита' }
          $zip = Join-Path $env:RUNNER_TEMP 'kazna-portable.zip'
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ZIP_ID/zip" -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept="application/vnd.github+json"} -OutFile $zip
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $env:SHA256) { throw 'Контрольная сумма не совпала' }
          $folder = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive -LiteralPath $zip -DestinationPath $folder
          $exe = Join-Path $folder 'Kazna.exe'
          if ((Get-Item -LiteralPath $exe).VersionInfo.ProductVersion -ne '0.39.0') { throw 'Неверная версия приложения' }
          Add-Content $env:GITHUB_ENV "PTREASURY_BIN=$exe"
          Add-Content $env:GITHUB_ENV "PTREASURY_PR_SHA=$env:SOURCE_HEAD"
      - name: Закрыть платёж, сменить тему и вновь открыть
        run: node qa-window/theme-hint-acceptance.mjs theme
      - name: Контраст и подсказка в обеих темах
        if: success() || failure()
        run: node qa-window/theme-hint-acceptance.mjs controls
      - name: Диагностика только тестового окна
        if: failure()
        shell: pwsh
        run: |
          Get-Process -Name 'Kazna','msedgewebview2','WerFault' -ErrorAction SilentlyContinue | Select-Object ProcessName,Responding,MainWindowTitle
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000; StartTime=(Get-Date).AddMinutes(-12)} -ErrorAction SilentlyContinue | Select-Object -First 3 -ExpandProperty Message
          exit 0
      - name: Сохранить снимки и журнал
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: kazna-theme-win11
          path: .test-artifacts/ux039-qa/evidence/
          include-hidden-files: true
          if-no-files-found: warn
