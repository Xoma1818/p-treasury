name: Сквозные тесты

# Все e2e/*.test.mjs на настоящем окне приложения (Linux, WebKitGTK + xvfb).
# Windows-минуты дорогие, поэтому окно проверяется на Linux: ядро и интерфейс те же.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/core/**"
      - "src/**"
      - "src-tauri/**"
      - "e2e/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.ts"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Сквозные тесты в окне
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Системные библиотеки окна и WebDriver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev webkit2gtk-driver \
            libayatana-appindicator3-dev librsvg2-dev xvfb xdotool
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Интерфейс
        run: npm run build
      - name: Приложение со встроенным интерфейсом
        run: cargo build -p budget-app --features custom-protocol --locked --quiet
      - name: Сквозные тесты
        run: xvfb-run -a -s "-screen 0 1280x800x24" node --test --test-concurrency=1 "e2e/*.test.mjs"
