# Выпуск P-Treasury на GitHub Releases.
# Запускается тегом vX.Y.Z на main (ставится после слияния, см. docs/releasing.md).
# Делает: проверку, установщик для Windows, подпись для автообновления, latest.json
# и выпуск с описанием из раздела «## X.Y.Z» в CHANGELOG.md.
# Код закрыт, поэтому выпуск публикуется в открытом репозитории p-treasury-releases:
# оттуда установленная программа скачивает обновления без входа в GitHub.
# Нужны секреты: TAURI_SIGNING_PRIVATE_KEY (подпись обновлений) и RELEASES_TOKEN
# (токен с правом Contents: read and write на p-treasury-releases).
name: Выпуск

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Версия в теге совпадает с версией приложения
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for v in "$(jq -r .version package.json)" "$(jq -r .version src-tauri/tauri.conf.json)" \
                   "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"; do
            [ "$v" = "$tag" ] || { echo "::error::Тег $GITHUB_REF_NAME, а в файлах версия $v"; exit 1; }
          done
          grep -q "^## $tag\b" CHANGELOG.md || { echo "::error::В CHANGELOG.md нет раздела «## $tag»"; exit 1; }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: scripts/check.sh

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Описание выпуска из CHANGELOG.md
        id: notes
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          {
            echo 'body<<NOTES_END'
            awk -v t="$tag" '/^## /{p = ($2 == t)} p && !/^## /' CHANGELOG.md
            echo
            echo '**Как установить:** скачайте `P-Treasury_'"$tag"'_x64-setup.exe` ниже и запустите. Windows может предупредить о неизвестном издателе: «Подробнее» → «Выполнить в любом случае». Данные прежней версии сохраняются.'
            echo 'NOTES_END'
          } >> "$GITHUB_OUTPUT"
      - name: Секреты на месте
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY RELEASES_TOKEN; do
            [ -n "${!name}" ] || { echo "::error::Нет секрета $name (Settings → Secrets and variables → Actions)"; exit 1; }
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Адрес, по которому установленная программа ищет обновления (вшивается при сборке).
          PTREASURY_UPDATE_ENDPOINT: https://github.com/${{ github.repository_owner }}/p-treasury-releases/releases/latest/download/latest.json
        with:
          owner: ${{ github.repository_owner }}
          repo: p-treasury-releases
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: P-Treasury ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
