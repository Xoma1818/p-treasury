# Выпуск Kazna (бывш. P-Treasury) на GitHub Releases.
# Имена файлов берутся из productName/mainBinaryName в src-tauri/tauri.conf.json.
# Запуск: Actions → «Выпуск» → Run workflow на main (после слияния, см. docs/releasing.md).
# Номер версии берётся из package.json; тег vX.Y.Z ставится на main в конце, когда выпуск опубликован.
# Делает: проверку, установщик для Windows, подпись для автообновления, latest.json,
# архив переносной версии и выпуск с описанием из раздела «## X.Y.Z» в CHANGELOG.md.
# Код закрыт, поэтому выпуск публикуется в открытом репозитории p-treasury-releases:
# оттуда установленная программа скачивает обновления без входа в GitHub.
# Нужны секреты: TAURI_SIGNING_PRIVATE_KEY (подпись обновлений) и RELEASES_TOKEN
# (токен с правом Contents: read and write на p-treasury-releases).
name: Выпуск

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: release

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Версия, CHANGELOG и тег
        id: version
        run: |
          [ "$GITHUB_REF_NAME" = main ] || { echo "::error::Выпуск делается только из main"; exit 1; }
          ver="$(jq -r .version package.json)"
          for v in "$(jq -r .version src-tauri/tauri.conf.json)" \
                   "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"; do
            [ "$v" = "$ver" ] || { echo "::error::В package.json версия $ver, а рядом $v"; exit 1; }
          done
          # Имя программы не должно откатиться при слиянии (так случилось в 0.27.0).
          # При намеренном переименовании поменять APP_NAME здесь же.
          APP_NAME=Kazna
          for f in productName mainBinaryName; do
            v="$(jq -r ".$f" src-tauri/tauri.conf.json)"
            [ "$v" = "$APP_NAME" ] || { echo "::error::В tauri.conf.json $f = $v, ожидается $APP_NAME"; exit 1; }
          done
          [ "$(jq -r '.bundle.windows.nsis.installerHooks // empty' src-tauri/tauri.conf.json)" = windows/hooks.nsh ] \
            || { echo "::error::В tauri.conf.json нет bundle.windows.nsis.installerHooks (удаление старой P-Treasury)"; exit 1; }
          grep -q "^## $ver\b" CHANGELOG.md || { echo "::error::В CHANGELOG.md нет раздела «## $ver»"; exit 1; }
          git fetch --tags --quiet
          ! git rev-parse -q --verify "refs/tags/v$ver" >/dev/null || { echo "::error::Версия $ver уже выпущена (тег v$ver есть)"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: scripts/check.sh

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Описание выпуска из CHANGELOG.md
        id: notes
        shell: bash
        run: |
          tag="${{ needs.check.outputs.version }}"
          name=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<NOTES_END'
            awk -v t="$tag" '/^## /{p = ($2 == t)} p && !/^## /' CHANGELOG.md
            echo
            echo '**Как установить:** скачайте `'"$name"'_'"$tag"'_x64-setup.exe` ниже и запустите. Windows может предупредить о неизвестном издателе: «Подробнее» → «Выполнить в любом случае». Данные прежней версии сохраняются.'
            echo
            echo '**Без установки (флешка):** распакуйте `'"$name"'_'"$tag"'_x64-portable.zip` куда угодно и запустите `'"$name"'.exe`. Данные хранятся в папке `data` рядом с программой, обновления ставятся вручную: новый архив распаковывается поверх старого.'
            echo 'NOTES_END'
          } >> "$GITHUB_OUTPUT"
      - name: Секреты на месте
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY RELEASES_TOKEN; do
            [ -n "${!name}" ] || { echo "::error::Нет секрета $name (Settings → Secrets and variables → Actions)"; exit 1; }
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Адрес, по которому установленная программа ищет обновления (вшивается при сборке).
          PTREASURY_UPDATE_ENDPOINT: https://github.com/${{ github.repository_owner }}/p-treasury-releases/releases/latest/download/latest.json
        with:
          owner: ${{ github.repository_owner }}
          repo: p-treasury-releases
          releaseCommitish: main
          tagName: v${{ needs.check.outputs.version }}
          releaseName: ${{ steps.notes.outputs.name }} v${{ needs.check.outputs.version }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Переносная версия (архив для флешки)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          ver="${{ needs.check.outputs.version }}"
          name=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          bin=$(node -p "require('./src-tauri/tauri.conf.json').mainBinaryName")
          exe="target/release/$bin.exe"
          [ -f "$exe" ] || { echo "::error::Нет $exe после сборки"; exit 1; }
          dir="${name}_${ver}_portable"
          mkdir "$dir"
          cp "$exe" "$dir/$name.exe"
          : > "$dir/portable"
          7z a -tzip "${name}_${ver}_x64-portable.zip" "$dir"
          gh release upload "v$ver" "${name}_${ver}_x64-portable.zip" \
            --repo "${{ github.repository_owner }}/p-treasury-releases"

  tag:
    needs: [check, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Тег версии на main
        run: |
          git tag "v${{ needs.check.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ needs.check.outputs.version }}"
