name: Сообщения установленной Kazna 0.41.3 при сбое обновления
on:
  push:
    branches: [codex/qa-041-installed-update]
    paths:
      - '.github/workflows/qa-feedback-0413.yml'
      - '.github/qa/041-update/feedback-check.ps1'
      - '.github/qa/041-update/feedback-feed.ps1'
      - '.github/qa/041-update/feedback.mjs'
permissions:
  contents: read
  actions: read
jobs:
  feedback:
    name: Потеря сети и отказ проверки подписи в окне Windows 11
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/qa/041-update
          path: harness
      - uses: actions/checkout@v5
        with:
          ref: bf3a70ef8a5f4ab55b61caaeadded80f51664fac
          persist-credentials: false
          path: source
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
        working-directory: source
      - name: Драйвер для предустановленного WebView2
        shell: pwsh
        run: ./harness/.github/qa/041-update/windows-driver.ps1
      - name: Проверка двух сообщений, данных и установленной версии
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./harness/.github/qa/041-update/feedback-check.ps1 -Source (Resolve-Path ./source).Path
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: kazna-0413-feedback-windows
          path: ${{ runner.temp }}/kazna-feedback-evidence/
          if-no-files-found: warn
          retention-days: 7
