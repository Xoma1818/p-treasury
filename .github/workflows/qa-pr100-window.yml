name: Проверка новых функций PR 100 в окне Windows
on:
  push:
    branches: [codex/qa-pr100-window]
permissions:
  actions: read
  contents: read
jobs:
  window:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # Код сборки тот же; новый коммит исправляет только сценарии E2E.
          ref: c689cd10fc37f4d05cc382e11598f9b9a299dabe
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: msedgedriver под версию WebView2
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $ver = (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv
          if (-not $ver) { $ver = (Get-Item "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion }
          Write-Host "WebView2 $ver"
          $dir = "$env:RUNNER_TEMP\msedgedriver"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $ok = $false
          foreach ($h in 'https://msedgedriver.microsoft.com', 'https://msedgedriver.azureedge.net') {
            try { Invoke-WebRequest "$h/$ver/edgedriver_win64.zip" -OutFile "$dir\d.zip"; $ok = $true; break } catch { Write-Host "нет на $h" }
          }
          if (-not $ok) { throw "не скачался msedgedriver $ver" }
          Expand-Archive "$dir\d.zip" -DestinationPath $dir -Force
          & "$dir\msedgedriver.exe" --version
          Add-Content $env:GITHUB_PATH $dir
      - name: Переносная сборка кандидата
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: '44876074450'
          SOURCE_SHA: fcb7bb451f5dcbee3bed137b5ead3c9877dbe100
          ARTIFACT_ID: '14697115933'
          SHA256: 673d91db69135754e69b1be18c4053ddda692409f5c47ef03e9084ce6fa74724
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne $env:SOURCE_SHA -or $run.conclusion -ne 'success') { throw 'Не подтверждена исходная сборка' }
          $zip = Join-Path $env:RUNNER_TEMP 'kazna-pr100.zip'
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ARTIFACT_ID/zip" -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept="application/vnd.github+json"} -OutFile $zip
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $env:SHA256) { throw 'SHA-256 артефакта не совпала' }
          $portable = Join-Path $env:RUNNER_TEMP 'kazna-pr100'
          Expand-Archive -LiteralPath $zip -DestinationPath $portable
          Add-Content $env:GITHUB_ENV "PTREASURY_BIN=$(Join-Path $portable 'Kazna.exe')"
      - name: Сверка, CSV, календарь, графики и цели
        run: node --test --test-concurrency=1 e2e/reconciliation.test.mjs e2e/csv-profiles.test.mjs e2e/reminders-ahead.test.mjs e2e/forecast.test.mjs e2e/wave5.test.mjs e2e/wave7.test.mjs
