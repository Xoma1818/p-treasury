name: Расчётные разделы Kazna 0.45.1 — проверка действий
on:
  push:
    branches: [codex/qa-0451-oracle-screen-actions]
permissions:
  contents: read
jobs:
  controls:
    runs-on: windows-11-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        batch: [groups, budget, forecast, flow, reports, home, extras]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - shell: pwsh
        run: ./scripts/setup-windows-test-driver.ps1
      - name: Выпущенный переносной EXE
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod 'https://api.github.com/repos/Xoma1818/p-treasury-releases/releases/tags/v0.45.1'
          $asset = $rel.assets | Where-Object name -eq 'Kazna_0.45.1_x64-portable.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'published.zip'
          Invoke-WebRequest $asset.browser_download_url -OutFile $zip
          if('sha256:'+(Get-FileHash $zip).Hash.ToLowerInvariant() -ne $asset.digest){throw 'Неверный ZIP'}
          $out = Join-Path $env:RUNNER_TEMP 'release'
          Expand-Archive -LiteralPath $zip -DestinationPath $out
          $exe=(Get-ChildItem $out -Filter 'Kazna.exe' -File -Recurse).FullName
          # Test harness creates a fresh --data-dir for each scenario.
          if((Get-Item $exe).VersionInfo.ProductVersion -ne '0.45.1'){throw 'Неверная версия'}
          "PTREASURY_BIN=$exe" | Out-File -Append $env:GITHUB_ENV
          "KAZNA_CONTROLS_OUT=$env:RUNNER_TEMP\controls" | Out-File -Append $env:GITHUB_ENV
          Write-Host "$($asset.digest) EXE $((Get-FileHash $exe).Hash)"
      - name: Действия и независимые ожидания
        shell: pwsh
        run: node e2e/qa-finance-0451.mjs ${{ matrix.batch }}
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: finance-${{ matrix.batch }}
          path: ${{ runner.temp }}/controls/
          if-no-files-found: warn
