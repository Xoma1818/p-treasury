# Пробная проверка обновления P-Treasury 0.25.0 -> Kazna 0.26 на Windows. Только для ветки треда 9, в main не идёт.
# Старая версия — выпуск v0.25.0 (в обычную папку и в свою через /D). Новая — сборка windows-installer ровно на текущем head PR #50 (иначе ошибка).
# Данные: база примера схемы 0.25 (тред 26, upgrade-0.25.db), открытая старой программой, плюс счёт-метка; сверка снимков до и после (snap.py).
name: Проверка обновления до Kazna

on:
  push:
    branches: [claude/project-thread-qfjnd1]
    paths: [".github/workflows/upgrade-check.yml", ".github/upgrade-check/**"]

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  PR: "50"
  OLD_TAG: v0.25.0

jobs:
  upgrade:
    name: upgrade (${{ matrix.case }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: обычная папка
            old_dir: ""
            old_running: ""
          - case: своя папка /D
            old_dir: 'C:\Apps\P Treasury Old'
            old_running: ""
          - case: старая запущена
            old_dir: ""
            old_running: "1"
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
      OLD_DIR: ${{ matrix.old_dir }}
      OLD_RUNNING: ${{ matrix.old_running }}
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: .github/upgrade-check }
      - name: Скачать установщики (новый — строго с head PR)
        shell: bash
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" -q .head.sha)
          ref=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" -q .head.ref)
          run=$(gh run list -R "$GITHUB_REPOSITORY" -w windows-installer.yml -b "$ref" -s success -L 20 \
                --json databaseId,headSha -q "map(select(.headSha == \"$sha\")) | .[0].databaseId // empty")
          [ -n "$run" ] || { echo "::error::Нет успешной сборки windows-installer на head PR #$PR ($sha)"; exit 1; }
          echo "PR #$PR head $sha, сборка $run"
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n kazna-windows-installer -D new
          gh release download "$OLD_TAG" -R "${{ github.repository_owner }}/p-treasury-releases" -p 'P-Treasury_*_x64-setup.exe' -D old
          ls -la new old
      - name: Установить 0.25, завести данные, обновить до Kazna, сверить
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fail = @()
          $la = $env:LOCALAPPDATA; $ad = $env:APPDATA
          $data = "$ad\app.kazna.desktop"; $db = "$data\budget.db"
          $docs = [Environment]::GetFolderPath('MyDocuments')
          $uk = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $sm = "$ad\Microsoft\Windows\Start Menu\Programs"
          $desk = [Environment]::GetFolderPath('Desktop')
          $snap = '.github\upgrade-check\snap.py'
          function Show($t) { Write-Host "== $t"
            Get-ChildItem $la, 'C:\Apps' -Directory -ErrorAction SilentlyContinue | ? Name -match 'Kazna|P.Treasury' | % { Write-Host "  папка $($_.FullName): $((Get-ChildItem $_.FullName).Name -join ', ')" }
            Get-ChildItem $uk | ? PSChildName -match 'Kazna|P-Treasury' | % { Write-Host "  реестр $($_.PSChildName)" }
            Get-ChildItem $sm, $desk -Filter *.lnk -Recurse -ErrorAction SilentlyContinue | ? Name -match 'Kazna|P-Treasury' | % { Write-Host "  ярлык $($_.FullName)" }
            Get-ChildItem $docs -Directory | ? Name -match 'Kazna|P-Treasury' | % { Write-Host "  документы $($_.FullName): $((Get-ChildItem $_.FullName -Recurse -File).Count) файлов" } }
          function RunApp($exe) { $p = Start-Process $exe -PassThru; Start-Sleep 25
            Get-Process | ? { $_.Path -eq $exe } | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep 3 }

          $odir = if ($env:OLD_DIR) { $env:OLD_DIR } else { "$la\P-Treasury" }
          $old = (Get-ChildItem old\*.exe)[0].FullName; Write-Host "Старая: $old в $odir"
          $iargs = if ($env:OLD_DIR) { "/S /D=$($env:OLD_DIR)" } else { '/S' }
          Start-Process $old -ArgumentList $iargs -Wait
          if (-not (Test-Path "$odir\p-treasury.exe")) { throw "старая версия не установилась в $odir" }
          RunApp "$odir\p-treasury.exe"
          if (-not (Test-Path $db)) { throw "старая программа не создала $db" }
          # Подменяем пустую базу на базу с данными примера (тред 26: 8 счетов, 90 операций, займы, бюджет).
          Remove-Item "$db-wal", "$db-shm" -ErrorAction SilentlyContinue
          Copy-Item .github\upgrade-check\upgrade-0.25.db $db -Force
          python $snap seed $db
          RunApp "$odir\p-treasury.exe"   # старая программа открывает базу с меткой и делает свои копии
          Show 'старая версия с данными'
          # Старая программа при запуске сама обновляет копии в Документах, поэтому снимок — уже после её старта.
          if ($env:OLD_RUNNING) { Start-Process "$odir\p-treasury.exe"; Start-Sleep 20
            Write-Host "Старая запущена: $((Get-Process p-treasury -ErrorAction SilentlyContinue).Count) процессов" }
          python $snap take $db "$docs\P-Treasury" before.json

          $new = (Get-ChildItem new\*.exe)[0].FullName; Write-Host "Новая: $new"
          Start-Process $new -ArgumentList '/S' -Wait
          Start-Sleep 5
          if (Get-Process p-treasury -ErrorAction SilentlyContinue) { $fail += 'старая P-Treasury осталась запущенной после установки Kazna' }
          Show 'после установки Kazna'
          if (Test-Path "$odir\p-treasury.exe") { $fail += "осталась старая программа в $odir" }
          if (Test-Path $odir) { Write-Host "  (папка $odir осталась: $((Get-ChildItem $odir -Recurse).Name -join ', '))" }
          if (-not (Test-Path "$la\Kazna\Kazna.exe")) { $fail += 'нет Kazna.exe' }
          if (Test-Path "$uk\P-Treasury") { $fail += 'остался пункт P-Treasury в «Установке и удалении программ»' }
          if (-not (Test-Path "$uk\Kazna")) { $fail += 'нет пункта Kazna в «Установке и удалении программ»' }
          $lnk = Get-ChildItem $sm, $desk -Filter *.lnk -Recurse -ErrorAction SilentlyContinue
          if ($lnk | ? Name -match 'P-Treasury') { $fail += 'остались ярлыки P-Treasury' }
          if (-not ($lnk | ? Name -eq 'Kazna.lnk')) { $fail += 'нет ярлыка Kazna' }

          # Первый запуск (перенос Документы\P-Treasury -> Kazna), затем второй запуск с ярлыка: процесс должен остаться один.
          $kz = "$la\Kazna\Kazna.exe"
          Start-Process $kz; Start-Sleep 20
          Start-Process $kz; Start-Sleep 10
          $n = @(Get-Process Kazna -ErrorAction SilentlyContinue).Count
          Write-Host "Процессов Kazna после двух запусков: $n"
          if ($n -ne 1) { $fail += "после двух запусков процессов Kazna: $n (ожидался один)" }
          Get-Process Kazna -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 3
          Show 'после первого запуска Kazna'
          python $snap take $db "$docs\Kazna" after.json
          python $snap compare before.json after.json
          if ($LASTEXITCODE -ne 0) { $fail += 'данные после обновления не совпали со старыми (см. выше)' }
          if ((Test-Path "$docs\P-Treasury") -and (Get-ChildItem "$docs\P-Treasury" -Recurse -File)) { $fail += 'в Документы\P-Treasury остались файлы' }

          if ($fail) { $fail | % { Write-Host "::error::$_" }; exit 1 }
          Write-Host 'ВСЁ ХОРОШО: одна копия Kazna, база и копии сохранности на месте, ярлыки Kazna, один процесс'
