name: Проверка обновления Kazna 0.37.2 до 0.41.2
on:
  push:
    branches: [codex/qa-041-installed-update]
    paths:
      - '.github/workflows/qa-041-installed-update.yml'
      - '.github/qa/041-update/check-update.ps1'
      - '.github/qa/041-update/prepare-tls.ps1'
      - '.github/qa/041-update/serve-feed.ps1'
      - '.github/qa/041-update/verify-update.mjs'
      - '.github/qa/041-update/windows-driver.ps1'
      - '.github/qa/041-update/windows-full-disk.ps1'
      - '.github/qa/041-update/test-windows.ps1'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/qa/041-update
          path: harness
      - uses: actions/checkout@v5
        with:
          ref: e43448858979be832162d274a0aefb7c54403763
          persist-credentials: false
          path: source
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
        working-directory: source
      - name: Драйвер для предустановленного WebView2
        shell: pwsh
        run: ./harness/.github/qa/041-update/windows-driver.ps1
      - name: Проверка обновления из окна программы
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./harness/.github/qa/041-update/check-update.ps1 -Source (Resolve-Path ./source).Path
  windows-scenarios:
    name: Одиннадцать групп в окне Windows 11
    # A diagnostic retry of the updater on the same application commit can opt out explicitly.
    if: ${{ !contains(github.event.head_commit.message, '[update-only]') }}
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/qa/041-update
          path: harness
      - uses: actions/checkout@v5
        with:
          ref: e43448858979be832162d274a0aefb7c54403763
          persist-credentials: false
          path: source
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
        working-directory: source
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install tauri-driver --version 2.1.0 --locked
      - run: ./harness/.github/qa/041-update/windows-driver.ps1
        shell: pwsh
      - name: Официальный exe и штатные оконные сценарии
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./harness/.github/qa/041-update/test-windows.ps1 -Source (Resolve-Path ./source).Path
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: kazna-041-windows-scenarios
          path: ${{ runner.temp }}/kazna-041-scenarios/logs
          if-no-files-found: warn
          retention-days: 7

  full-disk:
    name: Сохранность копии при заполнении диска Windows 11
    runs-on: windows-11-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/qa/041-update
          path: harness
      - uses: actions/checkout@v5
        with:
          ref: e43448858979be832162d274a0aefb7c54403763
          persist-credentials: false
          path: source
      - uses: dtolnay/rust-toolchain@stable
      - name: Проверка резервной копии на отдельном томе
        shell: pwsh
        run: ./harness/.github/qa/041-update/windows-full-disk.ps1 -Source (Resolve-Path ./source).Path
