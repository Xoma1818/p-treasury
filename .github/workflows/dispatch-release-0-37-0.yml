name: Запуск выпуска Kazna 0.37.0
on:
  push:
    branches: [codex/qa-pr100-window]
    paths: ['.github/workflows/dispatch-release-0-37-0.yml']
permissions: {}
concurrency:
  group: kazna-0-37-0-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.repository == 'Xoma1818/p-treasury'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: d624b307ef7fc8f0016160e84342bfb155056542
    steps:
      - name: Запустить штатный выпуск из проверенного main
        shell: bash
        run: |
          set -euo pipefail
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$actual" == "$EXPECTED_MAIN" ]]
          count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs" -f branch=main -f event=workflow_dispatch -f head_sha="$EXPECTED_MAIN" --jq .total_count)
          [[ "$count" =~ ^[0-9]+$ ]]
          if [[ "$count" -ne 0 ]]; then
            echo "Выпуск с этого коммита уже запущен."
            exit 0
          fi
          gh workflow run release.yml --ref main --repo "$GITHUB_REPOSITORY"
