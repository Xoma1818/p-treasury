# Пробный установщик P-Treasury для Windows: собирается на машине GitHub с Windows.
# Запуск: на каждый запрос на слияние или вкладка Actions → «Установщик для Windows» → Run workflow.
# Готовый .exe и переносная версия — в Artifacts запуска. Выпуски собирает release.yml (docs/releasing.md).
# Ключ подписи обновлений хранится в секрете TAURI_SIGNING_PRIVATE_KEY (не в репозитории).
# Без секрета установщик собирается без файла подписи для автообновления.
name: Установщик для Windows

on:
  workflow_dispatch:
  pull_request:
    # PR только с документами не собирает программу: сборка тратит минуты Actions (30–50 на запуск).
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: scripts/check.sh

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Сборка установщика
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --bundles nsis
          else
            npx tauri build --bundles nsis --config src-tauri/tauri.nokey.conf.json
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: p-treasury-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
      - name: Переносная версия
        shell: bash
        run: |
          mkdir portable
          cp target/release/p-treasury.exe portable/P-Treasury.exe
          : > portable/portable
      - uses: actions/upload-artifact@v5
        with:
          name: p-treasury-windows-portable
          path: portable/
