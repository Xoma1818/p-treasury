# Пробный установщик Kazna для Windows: собирается на машине GitHub с Windows.
# Запуск: на каждый запрос на слияние или вкладка Actions → «Установщик для Windows» → Run workflow.
# Готовый .exe и переносная версия — в Artifacts запуска. Выпуски собирает release.yml (docs/releasing.md).
# Ключ подписи обновлений хранится в секрете TAURI_SIGNING_PRIVATE_KEY (не в репозитории).
# Без секрета установщик собирается без файла подписи для автообновления.
name: Установщик для Windows

on:
  workflow_dispatch:
    inputs:
      accept_installer:
        description: Проверить установку 0.42.8 и переход с 0.42.1 в двух чистых Windows 11
        type: boolean
        default: false
  pull_request:
    # PR только с документами не собирает программу: сборка тратит минуты Actions (30–50 на запуск).
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
      - ".codex/agents/**"
      - ".agents/skills/p-treasury-team/**"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: scripts/check.sh

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Сборка установщика
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --bundles nsis
          else
            npx tauri build --bundles nsis --config src-tauri/tauri.nokey.conf.json
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: kazna-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
      - name: Переносная версия
        shell: bash
        run: |
          mkdir portable
          name=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          bin=$(node -p "require('./src-tauri/tauri.conf.json').mainBinaryName")
          cp "target/release/$bin.exe" "portable/$name.exe"
          : > portable/portable
      - uses: actions/upload-artifact@v5
        with:
          name: kazna-windows-portable
          path: portable/

  window:
    name: Окно Kazna x64 · ${{ matrix.platform }}
    needs: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Server x64, runner: windows-latest, screenshots: kazna-windows-window }
          - { platform: Windows 11 ARM64, runner: windows-11-arm, screenshots: kazna-windows11-window }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: kazna-windows-portable
          path: portable/
      - name: Окно и содержимое совпадают до и после изменения размера
        shell: pwsh
        run: |
          $name = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).productName
          ./scripts/windows-webview-layout.ps1 -AppPath "./portable/$name.exe" -CaptureDirectory "$env:RUNNER_TEMP/kazna-layout"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ${{ matrix.screenshots }}
          path: ${{ runner.temp }}/kazna-layout/*.png
          if-no-files-found: warn
      - uses: actions/download-artifact@v5
        if: matrix.runner == 'windows-11-arm'
        with:
          name: kazna-windows-installer
          path: target/release/bundle/nsis/
      - name: Ярлыки и значки установленной Kazna
        if: matrix.runner == 'windows-11-arm'
        shell: pwsh
        run: ./scripts/windows-brand-assets.ps1
      - uses: actions/upload-artifact@v5
        if: always() && matrix.runner == 'windows-11-arm'
        with:
          name: kazna-shortcut-icons
          path: ${{ runner.temp }}/kazna-shell-icons/*.png
          if-no-files-found: warn

  installed-candidate:
    name: Установленная Kazna · ${{ matrix.mode }}
    needs: windows
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.accept_installer) ||
      (github.event_name == 'pull_request' && github.head_ref == 'codex/acceptance-0428')
    permissions:
      contents: read
    runs-on: windows-11-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [clean, upgrade]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: kazna-windows-installer
          path: ${{ runner.temp }}/kazna-pr-installer
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: matrix.mode == 'upgrade'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: npm ci
      - name: Драйвер для WebView2 одноразовой Windows 11
        shell: pwsh
        run: ./scripts/setup-windows-test-driver.ps1
      - name: Установка и проверка данных
        shell: pwsh
        env:
          INSTALL_MODE: ${{ matrix.mode }}
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'kazna-pr-installer/Kazna_0.42.8_x64-setup.exe'
          $options = @{
            Mode = $env:INSTALL_MODE
            CandidateInstaller = (Get-Item -LiteralPath $setup).FullName
            EvidenceDirectory = (Join-Path $env:RUNNER_TEMP 'kazna-installed-evidence')
          }
          if ($env:INSTALL_MODE -eq 'upgrade') {
            $old = Join-Path $env:RUNNER_TEMP 'Kazna_0.42.1_x64-setup.exe'
            Invoke-WebRequest -Uri 'https://github.com/Xoma1818/p-treasury-releases/releases/download/v0.42.1/Kazna_0.42.1_x64-setup.exe' -OutFile $old
            if ((Get-FileHash -LiteralPath $old).Hash -ne 'e546c60af79e121677d10536aec1f7ca371a3bb5d8bf956f233c97cccf7d62bf') {
              throw 'Неверная контрольная сумма установщика 0.42.1'
            }
            $options.OldInstaller = $old
          }
          ./scripts/windows-installed-candidate.ps1 @options
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: installed-0.42.8-${{ matrix.mode }}
          path: ${{ runner.temp }}/kazna-installed-evidence
          retention-days: 14
          if-no-files-found: warn
