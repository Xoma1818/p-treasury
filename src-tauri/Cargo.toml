[package]
name = "budget-app"
description = "Оболочка Tauri: окно приложения и команды для UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "budget_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
budget-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# Курсы ЦБ РФ; тот же reqwest, что уже приносит модуль обновлений.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[features]
# Встроить собранный интерфейс (dist) в бинарник; Tauri CLI включает это сам при `tauri build`.
custom-protocol = ["tauri/custom-protocol"]
