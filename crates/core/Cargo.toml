[package]
name = "budget-core"
description = "Ядро приложения: хранение, миграции, бизнес-правила. Без зависимостей от UI и Tauri."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
rust_xlsxwriter = "0.100.0"
csv = "1.4.0"
regex = "1"
calamine = "0.37.0"
encoding_rs = "0.8"
pdf-extract = "0.12.1"
# PDF графика займа: запись объектов (тот же lopdf, что у pdf-extract), разбор
# и подмножество встроенного шрифта DejaVu Sans Condensed.
lopdf = { version = "0.42", default-features = false }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
subsetter = { version = "0.2.6", default-features = false }

[dev-dependencies]
tempfile = "3"
proptest = "1"
