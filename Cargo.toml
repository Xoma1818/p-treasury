[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.26.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
rusqlite = { version = "0.40", features = ["bundled", "backup", "functions", "session"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# SQLite (C) собирается с оптимизацией и в отладочной сборке: сквозные тесты
# и замеры скорости на большой базе ближе к настоящей программе.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# Выпуск: оптимизация всей программы при сборке (меньше установщик, чуть быстрее
# работа) и без отладочных символов. Паника остаётся раскруткой: после сбоя
# одного действия остальные работают дальше.
[profile.release]
lto = true
codegen-units = 1
strip = true
