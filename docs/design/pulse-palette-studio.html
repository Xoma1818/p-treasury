  const root = document.getElementById('kazna-palette-studio');
  const labels = {
    palette:{petrol:'Петроль и фарфор',plum:'Слива и шампань',cobalt:'Кобальт и мел'},
    logo:{vault:'Свод',edge:'Гурт',leaves:'Створки',current:'Русло'},
    theme:{dark:'Тёмная',light:'Светлая'},
    page:{home:'Главная',journal:'Операции',accounts:'Счета'}
  };
  const state = {palette:'petrol',logo:'vault',theme:'dark',page:'home'};
  const accounts = [['Карта Рубин','19 734,56 ₽'],['Наличные','432,11 ₽'],['Долларовый счёт','57,75 $']];
  const rows = [
    ['18','Учебный каталог','Долларовый счёт','−2,25 $'],
    ['17','Учебный рынок','Наличные','−67,89 ₽'],
    ['16','Перевод в наличные','Карта Рубин','400 ₽'],
    ['15','Обмен валюты','Карта Рубин','900 ₽ → 10 $'],
    ['14','Возврат покупки','Карта Рубин','+34,56 ₽'],
    ['13','Учебная мастерская','Карта Рубин','−234,56 ₽'],
    ['12','Учебный проект','Карта Рубин','+1 234,56 ₽']
  ];
  for (const list of root.querySelectorAll('.ks-account-list')) {
    list.innerHTML = accounts.map(([name,sum]) => '<div class="ks-account"><span>'+name+'</span><strong>'+sum+'</strong></div>').join('');
  }
  for (const list of root.querySelectorAll('[data-rows]')) {
    const subset = list.dataset.rows==='recent' ? rows.slice(0,3) : rows;
    list.innerHTML = subset.map(([day,name,account,sum]) =>
      '<div class="ks-row"><time datetime="2026-11-'+day+'">'+day+' ноя</time><span class="ks-what">'+name+'</span><small>'+account+'</small><strong'+(sum.startsWith('+')?' data-in':'')+'>'+sum+'</strong></div>'
    ).join('');
  }
  function render() {
    root.dataset.theme = state.theme;
    root.dataset.palette = state.palette;
    root.dataset.logo = state.logo;
    root.querySelector('h1').textContent = labels.page[state.page];
    for (const use of root.querySelectorAll('[data-brand]')) use.setAttribute('href','#kz-'+state.logo);
    for (const button of root.querySelectorAll('[data-choose]')) button.setAttribute('aria-pressed',String(state[button.dataset.choose]===button.value));
    for (const button of root.querySelectorAll('[data-route]')) {
      if (button.dataset.route===state.page) button.setAttribute('aria-current','page');
      else button.removeAttribute('aria-current');
    }
    for (const section of root.querySelectorAll('[data-page]')) section.hidden = section.dataset.page!==state.page;
    const css = getComputedStyle(root);
    for (const swatch of root.querySelectorAll('[data-swatch]')) {
      const color = css.getPropertyValue('--'+swatch.dataset.swatch).trim();
      swatch.querySelector('i').style.background = color;
      swatch.querySelector('b').textContent = color.toUpperCase();
    }
  }
  function restore(snapshot) {
    const saved = snapshot?.privateContent;
    for (const key of Object.keys(state)) {
      if (Object.hasOwn(labels[key],saved?.[key])) state[key] = saved[key];
    }
    render();
  }
  function save() {
    const modelContent = {палитра:labels.palette[state.palette],знак:labels.logo[state.logo],тема:labels.theme[state.theme],экран:labels.page[state.page]};
    window.openai?.setWidgetState?.({modelContent,privateContent:{...state}})?.catch(()=>{});
  }
  root.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button || !root.contains(button)) return;
    const key = button.dataset.choose || 'page';
    const value = button.dataset.choose ? button.value : button.dataset.route || button.dataset.open;
    if (!Object.hasOwn(labels,key) || !Object.hasOwn(labels[key],value) || state[key]===value) return;
    state[key] = value;
    render();
    save();
    if (button.dataset.open) root.querySelector('[aria-current="page"]').focus({preventScroll:true});
  });
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals', event => {if (event.detail?.globals?.widgetState) restore(event.detail.globals.widgetState);});
})();
</script>
